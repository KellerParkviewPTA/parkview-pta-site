<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parkview PTA — Admin</title>
    <!-- Required for the git-gateway backend (Netlify Identity login) below
         to work — without this script the login screen fails to render.
         `defer` is required: without it this script runs before <body>
         exists and Decap CMS crashes trying to mount into it. -->
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Decap CMS: free, no-code admin panel. Content edited here is saved as
         markdown/JSON files in src/content/ via Git, which triggers a new
         Netlify deploy automatically. See README.md for login setup. -->
    <script defer src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <!-- Decap CMS reads /admin/config.yml automatically -->
  </body>
</html>
